name: CI / Deploy

on:
  push:
    branches: [livestream]
  pull_request:
    branches: [livestream]

# One deploy at a time. Two overlapping runs would interleave composer install,
# npm build and migrations in the same directory.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, intl, bcmath, pdo_sqlite, sqlite3, exif
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      # MUST come before the tests. public/build is gitignored, so a fresh
      # checkout has no Vite manifest, and every test that renders a layout
      # dies on "Vite manifest not found" rather than on anything real.
      #
      # It also earns its place independently: the PHP suite does not compile
      # JS, so a syntax error in app.js would otherwise deploy happily and
      # break the player in production.
      - name: Build assets
        run: npm run build

      # The suite runs on in-memory SQLite (see phpunit.xml), so no database
      # service is needed here.
      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/livestream'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          command_timeout: 20m
          script_stop: true
          # PROD_USER must be `grinmuzik`. PHP-FPM runs as that user, and a
          # deploy performed by anyone else leaves foreign-owned files in
          # vendor/ and public/build that FPM cannot read — a 500 on every page.
          # deploy.sh refuses to run as anyone else rather than half-breaking the
          # site.
          script: bash /home/grinmuzik/dson-music/deploy.sh
